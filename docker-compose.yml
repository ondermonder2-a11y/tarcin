services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tarcinyemek
    restart: unless-stopped
    ports:
      - "3013:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
      LOVABLE_NITRO_PRESET: node-server
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      SMTP_SETTINGS_ENCRYPTION_KEY: ${SMTP_SETTINGS_ENCRYPTION_KEY:-}
      SMTP_SETTINGS_FILE: /data/smtp-settings.enc
      # Site iÃ§eriÄŸi veritabanÄ± (admin kayÄ±tlarÄ± buraya yazÄ±lÄ±r, /data kalÄ±cÄ± biriminde).
      SITE_CONTENT_DB_FILE: ${SITE_CONTENT_DB_FILE:-/data/site-content.json}
      SITE_MEDIA_DIR: ${SITE_MEDIA_DIR:-/data/media}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
    volumes:
      - .:/app
      - /app/node_modules
      - tarcin_mail_data:/data

volumes:
  tarcin_mail_data:


